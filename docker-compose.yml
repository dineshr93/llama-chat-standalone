services:
  llama-chat:
    build: .
    image: llama-chat-standalone
    # The model server publishes 8888 on the host loopback only, so a bridge
    # container cannot reach it: host-gateway resolves to 172.17.0.1, where
    # nothing listens. Share the host network namespace instead.
    network_mode: host
    environment:
      UPSTREAM: ${UPSTREAM:-http://127.0.0.1:8888}
      UPSTREAMS: ${UPSTREAMS:-workshop=http://127.0.0.1:8888,workshops=http://workshops:8888}
      MODEL_ID: ${MODEL_ID:-local-model}
      N_CTX: ${N_CTX:-65556}
      CHAT_TEMPLATE: ${CHAT_TEMPLATE:-}
      MODALITIES: ${MODALITIES:-}
      API_KEY: ${API_KEY:-}
    restart: unless-stopped
